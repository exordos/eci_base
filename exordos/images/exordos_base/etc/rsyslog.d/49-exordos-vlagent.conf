# Forward all syslog messages to the local vlagent (VictoriaLogs agent)
# which listens for syslog over TCP on 127.0.0.1:9514.
#
# vlagent then relays the logs to the platform-wide VictoriaLogs instance
# at victoria-storage.local.genesis-core.tech.
#
# The RSYSLOG_SyslogProtocol23Format template produces RFC 5424 syslog
# messages, which vlagent parses natively.
#
# See https://docs.victoriametrics.com/victorialogs/data-ingestion/syslog/#rsyslog

*.* action(type="omfwd"
    Target="127.0.0.1"
    Port="9514"
    Protocol="tcp"
    Template="RSYSLOG_SyslogProtocol23Format"
    action.resumeRetryCount="-1")
