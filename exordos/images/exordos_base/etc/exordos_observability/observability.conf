# Observability backend host (VictoriaMetrics + VictoriaLogs).
#
# Consumed by:
#   - exordos-vmagent.service   (remoteWrite URL, port 8428)
#   - exordos-vlagent.service   (remoteWrite URL, port 9428)
#   - exordos-observability-wait-dns.sh (DNS resolution check)
#
# Override this value to point the agents at a different observability
# backend. Sourced by systemd (EnvironmentFile) and by the wait-dns
# script, so keep the KEY=VALUE syntax with no spaces around "=".

OBS_HOST=victoria-storage.local.genesis-core.tech
