# systemd-journal-upload configuration.
#
# Sends local journald logs to the local vlagent (VictoriaLogs agent)
# which listens on 127.0.0.1:9429 and relays them to the platform-wide
# VictoriaLogs instance at victoria-storage.local.genesis-core.tech.
#
# The /insert/journald endpoint preserves structured journald fields
# (unit name, priority, PID, etc.) unlike forwarding through syslog.
#
# See https://docs.victoriametrics.com/victorialogs/data-ingestion/journald/

[Upload]
URL=http://127.0.0.1:9429/insert/journald
