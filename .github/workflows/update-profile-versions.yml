name: Update base image profile versions

on:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: update-profile-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Update organization repositories
        env:
          GH_TOKEN: ${{ secrets.EXORDOS_REPOSITORIES_TOKEN }}
        run: python .github/scripts/update_profile_versions.py
